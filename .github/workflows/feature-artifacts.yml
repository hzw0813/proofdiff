name: Feature artifacts

on:
  push:
    branches: [feature/actionable-unknowns]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify generated runtime is clean
        shell: bash
        run: |
          npm run build
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Run pinned external static evaluation
        shell: bash
        run: node scripts/evaluation/run-external.mjs --cache work/evaluation-corpus --proofdiff-root . --output work/external-results.json
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:action
      - run: npm run dogfood
      - run: npm run evaluation:controlled
      - run: npm run demo
      - run: npm pack --dry-run
      - name: Collect generated outputs
        shell: bash
        run: |
          mkdir -p feature-artifacts
          cp -R dist feature-artifacts/dist
          cp -R examples feature-artifacts/examples
          cp evaluation/controlled-results.candidate.json feature-artifacts/controlled-results.candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: actionable-unknowns-generated
          path: feature-artifacts
          if-no-files-found: error

  commit-generated:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/actionable-unknowns
      - uses: actions/download-artifact@v8
        with:
          name: actionable-unknowns-generated
          path: generated
      - name: Verify generated outputs still match without executing repository code
        shell: bash
        run: |
          rm -rf dist examples
          cp -R generated/dist dist
          cp -R generated/examples examples
          cp generated/controlled-results.candidate.json evaluation/controlled-results.candidate.json
          git add dist examples evaluation/controlled-results.candidate.json
          git diff --cached --exit-code
