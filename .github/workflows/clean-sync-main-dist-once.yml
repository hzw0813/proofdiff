name: Clean-sync tracked dist once

on:
  push:
    branches: [fix/tracked-dist-integrity]
    paths:
      - .github/workflows/clean-sync-main-dist-once.yml

permissions:
  contents: write

jobs:
  sync-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/tracked-dist-integrity
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - name: Commit clean-build dist if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist; then
            echo "dist already matches a clean build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist
          git commit -m "Clean-synchronize tracked dist"
          git push origin HEAD:fix/tracked-dist-integrity
