name: One-time repository-root whitespace updater

on:
  push:
    branches:
      - fix/repository-root-whitespace
    paths:
      - .github/workflows/one-time-repository-root-whitespace.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/repository-root-whitespace
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch repository-root path handling and regression
        run: python .github/scripts/one-time-repository-root-whitespace.py
      - run: npm test
      - run: npm run clean && npm run build
      - run: git diff --check
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/git.ts tests/git.test.ts CHANGELOG.md dist
          git commit -m "Preserve repository-root whitespace"
          git push origin HEAD:fix/repository-root-whitespace
