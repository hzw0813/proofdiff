name: Prepare v0.5.3 once

on:
  push:
    branches: [release/v0.5.3]
    paths:
      - .github/workflows/release-v0.5.3-prep-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.5.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/release-v0.5.3-once.mjs
      - run: npm test
      - run: npm run clean && npm run build
      - name: Commit release metadata and clean generated dist
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/analyze.ts CHANGELOG.md dist
          git commit -m "Prepare ProofDiff v0.5.3"
          git push origin HEAD:release/v0.5.3
