name: One-time JS runner rejection test updater

on:
  push:
    branches: [test/exercise-js-runner-rejections]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Make adversarial runner cases actually exercise parser
        shell: bash
        run: |
          python3 <<'PY'
          from base64 import b64decode
          from pathlib import Path
          old = b64decode('').decode()
          new = b64decode('').decode()
          path = Path('tests/js-runners.test.ts')
          text = path.read_text()
          if text.count(old) != 1:
              raise RuntimeError(f'expected adversarial test block exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm test
      - name: Commit test correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/js-runners.test.ts
          git diff --cached --check
          git commit -m "Exercise adversarial JS runner parser cases"
          git push
