name: One-time preserve ignored path identity

on:
  push:
    branches:
      - fix/preserve-ignored-path-identity
    paths:
      - .github/workflows/one-time-preserve-ignored-path-identity.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/preserve-ignored-path-identity
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply path-identity fix and regression
        run: python3 .github/scripts/one-time-preserve-ignored-path-identity.py
      - name: Run full tests
        run: npm test
      - name: Clean rebuild tracked dist
        run: npm run clean && npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/selection-workspace.ts tests/selection-workspace.test.ts dist
          git commit -m "Preserve ignored path identity"
          git push origin HEAD:fix/preserve-ignored-path-identity
