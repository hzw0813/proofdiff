name: One-time Python stub discovery updater

on:
  push:
    branches: [fix/python-stub-check-discovery]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exclude Python stubs from executable framework discovery
        run: python3 .github/scripts/one-time-python-stub-discovery.py
      - run: npm test
      - run: npm run clean && npm run build
      - name: Commit source, regressions, docs, and generated dist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests docs/verification-model.md CHANGELOG.md dist
          git diff --cached --check
          git commit -m "Do not infer Python runners from stub-only tests"
          git push
