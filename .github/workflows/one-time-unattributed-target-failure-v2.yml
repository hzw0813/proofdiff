name: One-time unattributed target failure hardening v2

on:
  push:
    branches:
      - fix/unattributed-target-failure-sink
    paths:
      - .github/workflows/one-time-unattributed-target-failure-v2.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unattributed-target-failure-sink
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply soundness fix and regression
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python3
      - name: Run full tests
        run: npm test
      - name: Clean rebuild tracked dist
        run: npm run clean && npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/checks.ts tests/analyze.test.ts dist
          git diff --cached --stat
          git commit -m "Fail closed on unattributed batch failures"
          git push origin HEAD:fix/unattributed-target-failure-sink
