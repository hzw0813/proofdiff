name: One-time unittest exit-five updater

on:
  push:
    branches:
      - fix/unittest-exit-five-semantics
    paths:
      - .github/workflows/one-time-unittest-exit-five.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unittest-exit-five-semantics
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch exit-code semantics and regression
        env:
          TEST_BLOCK_B64: 
          CHANGELOG_BULLET_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          old = 'check.exitCode === 5 && (check.targetRunner === "pytest" || check.targetRunner === "unittest")'
          new = 'check.exitCode === 5 && check.targetRunner === "pytest"'
          for name in ["src/evidence.ts", "src/explanation.ts"]:
              path = Path(name)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one exit-five semantic match in {name}, found {text.count(old)}")
              path.write_text(text.replace(old, new))

          test_path = Path("tests/analyze.test.ts")
          text = test_path.read_text()
          marker = 'test("a unittest loader failure without an attributable test failure fails closed", async (context) => {'
          if text.count(marker) != 1:
              raise SystemExit("unittest loader regression marker was not unique")
          block = base64.b64decode(os.environ["TEST_BLOCK_B64"]).decode()
          test_path.write_text(text.replace(marker, block + marker))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n\n### Fixed\n\n"
          if text.count(marker) != 1:
              raise SystemExit("unreleased changelog marker was not unique")
          bullet = base64.b64decode(os.environ["CHANGELOG_BULLET_B64"]).decode()
          changelog.write_text(text.replace(marker, marker + bullet, 1))
          PY
      - run: npm test
      - run: npm run clean && npm run build
      - run: git diff --check
      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evidence.ts src/explanation.ts tests/analyze.test.ts CHANGELOG.md dist
          git commit -m "Restrict exit-code 5 semantics to pytest"
          git push origin HEAD:fix/unittest-exit-five-semantics
