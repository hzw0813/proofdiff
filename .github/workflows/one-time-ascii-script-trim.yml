name: One-time ASCII script trim updater

on:
  push:
    branches: [fix/ascii-only-script-trim]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/one-time-ascii-script-trim.py
      - run: npm test
      - run: npm run clean && npm run build
      - name: Commit source, tests, changelog, and generated dist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md src/checks.ts src/js-runners.ts tests/checks.test.ts tests/js-runners.test.ts dist
          git diff --cached --check
          git commit -m "Restrict script trimming to ASCII whitespace"
          git push
