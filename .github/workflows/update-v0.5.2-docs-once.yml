name: Update v0.5.2 docs once

on:
  push:
    branches: [docs/published-v0.5.2]
    paths:
      - .github/workflows/update-v0.5.2-docs-once.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/published-v0.5.2
      - name: Update released references and workspace-boundary guidance
        run: python3 scripts/update-v0.5.2-docs-temp.py
      - name: Commit documentation updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/github-actions.md docs/verification-model.md docs/troubleshooting.md
          if git diff --cached --quiet; then
            echo "docs already updated"
            exit 0
          fi
          git commit -m "Document v0.5.2 immutable workspace boundary"
          git push origin HEAD:docs/published-v0.5.2
