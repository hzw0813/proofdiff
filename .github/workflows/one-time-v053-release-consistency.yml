name: One-time v0.5.3 release consistency updater

on:
  push:
    branches: [fix/v0.5.3-release-consistency]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Align latest-release docs and published Action smoke
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{path}: expected {expected} occurrences of {old!r}, found {count}")
              p.write_text(text.replace(old, new))

          replace_count('.github/workflows/ci.yml', 'v0.5.2', 'v0.5.3', 2)
          replace_count('README.md', 'v0.5.2', 'v0.5.3', 2)
          replace_count('docs/github-actions.md', 'v0.5.2', 'v0.5.3', 6)
          replace_count('docs/github-actions.md', 'd2927b13aedb64403bdf1d6b3fe70f1148d1dce6', 'd5fe3da78400a1b4d4154c0ddd9b84c3ef662e06', 1)
          replace_count('docs/troubleshooting.md', 'v0.5.2', 'v0.5.3', 1)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          anchor = '- Stopped `.pyi` stub files with test-like names from inventing executable pytest or `unittest` checks. Stubs remain available to static Python analysis and relationship discovery, but framework discovery now requires an executable `.py` test file; this prevents `--run-checks` from launching a Python test runner merely because a repository contains test-shaped type stubs.\n'
          if text.count(anchor) != 1:
              raise RuntimeError('CHANGELOG.md: expected Unreleased fixed-item anchor exactly once')
          addition = '- Updated current stable Action guidance and the published-Action CI smoke from v0.5.2 to the already-released v0.5.3 snapshot, including the immutable full-SHA pin, so documentation and release verification no longer lag the latest public release.\n'
          changelog.write_text(text.replace(anchor, anchor + addition, 1))
          PY
      - run: npm test
      - name: Commit release-consistency updates
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml README.md docs/github-actions.md docs/troubleshooting.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Align v0.5.3 release guidance and smoke test"
          git push
