name: Sync selection-binding dist once

on:
  push:
    branches: [hardening/selection-workspace-binding]
    paths:
      - src/**
      - .github/workflows/sync-dist-selection-workspace-once.yml

permissions:
  contents: write

jobs:
  sync-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/selection-workspace-binding
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated dist if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist; then
            echo "dist is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist
          git commit -m "Sync generated dist for selection binding"
          git push origin HEAD:hardening/selection-workspace-binding
