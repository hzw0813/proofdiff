name: One-time LCOV source-path updater

on:
  push:
    branches: [fix/lcov-source-path-whitespace]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 .github/scripts/one-time-lcov-source-path-whitespace.py
      - run: npm test
      - run: npm run clean && npm run build
      - name: Commit source, tests, changelog, and generated dist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md src/coverage.ts tests/coverage.test.ts dist
          git diff --cached --check
          git commit -m "Preserve LCOV source-path whitespace"
          git push
