name: Patch Node test script boundary once

on:
  push:
    branches: [hardening/node-test-script-boundary]
    paths:
      - .github/workflows/agent-node-test-boundary-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/node-test-script-boundary
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Patch parser and existing regression suite
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - run: npm ci
      - run: npm test
      - name: Clean rebuild tracked Action payload
        shell: bash
        run: |
          set -euo pipefail
          npm run clean
          npm run build
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git add src/checks.ts tests/checks.test.ts dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fail closed on chained Node test scripts"
          git push origin HEAD:hardening/node-test-script-boundary
