name: Release v0.4.2 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.4.2-once.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: e2d751fd1334bc666400fb4e954719cc4bc37ba3
      RELEASE_TAG: v0.4.2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or verify annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git cat-file -e "${RELEASE_TAG}^{tag}"
            test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "ProofDiff v0.4.2"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Dispatch verified release workflow
        shell: bash
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG" \
            -f publish_npm=true
