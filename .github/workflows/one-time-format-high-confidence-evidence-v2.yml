name: One-time high-confidence evidence formatting updater v2

on:
  push:
    branches: [fix/high-confidence-target-evidence]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize source indentation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function rewrite(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${file}: formatting transform made no change`);
            fs.writeFileSync(file, after);
          }

          rewrite('src/evidence.ts', (source) => {
            const lines = source.split('\n');
            let inProvisional = false;
            let provisionalDepth = 0;
            return lines.map((line) => {
              const trimmed = line.trim();
              if ([
                'const exactObservations = observations.filter(({ check, observation }) => qualificationForObservation(check, observation)?.confidence === "high");',
                'const provisionalObservations = observations.filter(({ check, observation }) => qualificationForObservation(check, observation)?.confidence !== "high");',
                'const targetedFailures = exactObservations.filter(({ observation }) => observation.outcome === "failed");',
                'const qualified = relevantQualifications.map((qualification) => qualification.path);',
                'const stronglyQualified = relevantQualifications.filter((qualification) => qualification.confidence === "high").map((qualification) => qualification.path);',
              ].includes(trimmed)) return `  ${trimmed}`;

              if (trimmed === 'for (const { check, observation } of provisionalObservations) {') {
                inProvisional = true;
                provisionalDepth = 0;
                return `  ${trimmed}`;
              }
              if (inProvisional) {
                if (trimmed === 'const qualification = qualificationForObservation(check, observation);') return `    ${trimmed}`;
                if (trimmed === 'evidence.push({') { provisionalDepth = 1; return `    ${trimmed}`; }
                if (provisionalDepth === 1 && trimmed === '});') { provisionalDepth = 0; return `    ${trimmed}`; }
                if (provisionalDepth === 1) return `      ${trimmed}`;
                if (trimmed === '}') { inProvisional = false; return `  ${trimmed}`; }
              }
              if (trimmed === 'for (const { check, observation } of exactObservations.filter(({ observation }) => !["passed", "failed"].includes(observation.outcome))) {') return `  ${trimmed}`;
              return line;
            }).join('\n');
          });

          rewrite('src/explanation.ts', (source) => source.split('\n').map((line) => {
            const trimmed = line.trim();
            if ([
              'const qualifiedPaths = new Set(relevantQualifications.filter((qualification) => qualification.confidence === "high").map((qualification) => qualification.path));',
              'const exactObservations = observations.filter(({ check, observation }) => qualificationForObservation(check, observation)?.confidence === "high");',
              'const failedObservation = exactObservations.find(({ observation }) => observation.outcome === "failed");',
            ].includes(trimmed)) return `  ${trimmed}`;
            return line;
          }).join('\n'));
          NODE
      - run: npm test
      - run: npm run clean && npm run build
      - name: Commit formatting and generated dist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/evidence.ts src/explanation.ts dist
          git diff --cached --check
          git commit -m "Normalize high-confidence evidence source formatting"
          git push
