name: Release v0.4.0 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.4.0-once.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create annotated tag and dispatch verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 0e38a51a77868877564daea7f7262aa129e53f21
          RELEASE_TAG: v0.4.0
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git cat-file -e "$RELEASE_TAG^{tag}"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "ProofDiff $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$RELEASE_TAG" \
            -f publish_npm=true
