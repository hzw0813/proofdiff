name: Sync immutable-selection dist once

on:
  push:
    branches: [hardening/immutable-selection-snapshot]
    paths:
      - .github/workflows/sync-immutable-selection-dist-once.yml

permissions:
  contents: write

jobs:
  sync-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/immutable-selection-snapshot
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - name: Commit clean-build dist if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist; then
            echo "dist already matches a clean build"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist
          git commit -m "Refresh generated dist for immutable selection binding"
          git push origin HEAD:hardening/immutable-selection-snapshot
