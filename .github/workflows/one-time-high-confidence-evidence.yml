name: One-time high-confidence target evidence updater

on:
  push:
    branches: [fix/high-confidence-target-evidence]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gate file-level evidence on high-confidence target identity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceRegex(file, pattern, replacement) {
            const source = fs.readFileSync(file, 'utf8');
            let count = 0;
            const next = source.replace(pattern, () => {
              count += 1;
              return replacement;
            });
            if (count !== 1) throw new Error(`${file}: expected exactly one regex replacement, found ${count}: ${pattern}`);
            fs.writeFileSync(file, next);
          }

          replaceRegex(
            'src/evidence.ts',
            /^  const targetedFailures = observations\.filter\(\(\{ observation \}\) => observation\.outcome === "failed"\);$/m,
            `  const qualificationForObservation = (check: CheckResult, observation: NonNullable<CheckResult["targetObservations"]>[number]) => check.targetQualifications?.find((qualification) => qualification.path === observation.path && qualification.runnerPath === observation.runnerPath);
          const exactObservations = observations.filter(({ check, observation }) => qualificationForObservation(check, observation)?.confidence === "high");
          const provisionalObservations = observations.filter(({ check, observation }) => qualificationForObservation(check, observation)?.confidence !== "high");
          const targetedFailures = exactObservations.filter(({ observation }) => observation.outcome === "failed");`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  const hasExactTargetFailure = .*$/m,
            `  const hasExactTargetFailure = (check: CheckResult): boolean => check.targetObservations?.some((observation) => observation.outcome === "failed" && qualificationForObservation(check, observation)?.confidence === "high") === true;`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  const hasUnavailableRelatedTarget = .*$/m,
            `  const hasUnavailableRelatedTarget = (check: CheckResult): boolean => check.targetObservations?.some((observation) => relatedTests.includes(observation.path) && observation.outcome === "not-observed" && qualificationForObservation(check, observation)?.confidence === "high") === true;`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  const testExecutions: FileAssessment\["testExecutions"\] = observations$/m,
            `  const testExecutions: FileAssessment["testExecutions"] = exactObservations`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  const executedTests = unique\(observations\.filter\(.*$/m,
            `  const executedTests = unique(exactObservations.filter(({ observation }) => observation.outcome === "passed" && observation.testsObserved > 0).map(({ observation }) => observation.path)).sort();`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^      label: `\$\{executedTests\.length\} qualified related target.*$/m,
            `      label: \`${'${executedTests.length}'} high-confidence qualified related target${'${executedTests.length === 1 ? "" : "s"}'} observed passing\`,`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^      detail: "ProofDiff explicitly supplied each qualified target and observed at least one non-skipped passing test for that exact path\..*$/m,
            `      detail: "ProofDiff explicitly supplied each high-confidence qualified target and observed at least one non-skipped passing test for that exact source path. This is file-scoped test evidence, not changed-symbol, changed-line, branch, assertion, or behavioral coverage.",`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  for \(const \{ check, observation \} of observations\.filter\(\(\{ observation \}\) => !\["passed", "failed"\]\.includes\(observation\.outcome\)\)\) \{$/m,
            `  for (const { check, observation } of provisionalObservations) {
            const qualification = qualificationForObservation(check, observation);
            evidence.push({
              kind: "limitation",
              label: \`${'${observation.path}'}: ${'${qualification?.confidence ?? "unknown"}'}-confidence target identity\`,
              detail: \`${'${observation.detail}'} ${'${qualification?.limitation ?? "The source-to-runner target identity was not established with high confidence."}'} The runtime observation remains available on the check, but it cannot strengthen this source path to verified without high-confidence target identity.\`,
              confidence: "high",
              checkId: check.id,
            });
          }

          for (const { check, observation } of exactObservations.filter(({ observation }) => !["passed", "failed"].includes(observation.outcome))) {`,
          );

          replaceRegex(
            'src/evidence.ts',
            /^  const qualified = checks\.flatMap\(.*$/m,
            `  const relevantQualifications = checks.flatMap((check) => check.targetQualifications ?? []).filter((qualification) => impactedSet.has(qualification.path) || declaredSet.has(qualification.path));
          const qualified = relevantQualifications.map((qualification) => qualification.path);
          const stronglyQualified = relevantQualifications.filter((qualification) => qualification.confidence === "high").map((qualification) => qualification.path);`,
          );
          replaceRegex(
            'src/evidence.ts',
            /Related test-like paths were found or declared, but no runner-qualified exact target produced a non-skipped passing test observation\./,
            `Related test-like paths were found or declared, but no high-confidence runner-qualified source target produced a non-skipped passing test observation.`,
          );
          replaceRegex(
            'src/evidence.ts',
            /Qualified related targets produced passing tests, but ProofDiff did not observe whether changed symbols, lines, branches, or relevant assertions executed\./,
            `High-confidence qualified related targets produced passing tests, but ProofDiff did not observe whether changed symbols, lines, branches, or relevant assertions executed.`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  const unqualifiedTestLike = staticallyTestLike\.filter\(\(candidate\) => !qualified\.includes\(candidate\)\);$/m,
            `  const unqualifiedTestLike = staticallyTestLike.filter((candidate) => !stronglyQualified.includes(candidate));`,
          );
          replaceRegex(
            'src/evidence.ts',
            /not qualified by a recognized runner convention or configuration\./,
            `lacked high-confidence qualification by a recognized runner convention or configuration.`,
          );
          replaceRegex(
            'src/evidence.ts',
            /^  const unqualifiedDeclared = declaredTests\.filter\(\(candidate\) => !qualified\.includes\(candidate\)\);$/m,
            `  const unqualifiedDeclared = declaredTests.filter((candidate) => !stronglyQualified.includes(candidate));`,
          );
          replaceRegex(
            'src/evidence.ts',
            /not qualified by a recognized runner convention or configuration; declarations do not bypass runner qualification\./,
            `lacked high-confidence qualification by a recognized runner convention or configuration; declarations do not bypass runner qualification.`,
          );

          replaceRegex(
            'src/explanation.ts',
            /^  const qualifiedPaths = new Set\(.*$/m,
            `  const relevantQualifications = checks.flatMap((check) => check.targetQualifications ?? []).filter((qualification) => item.relatedTests.includes(qualification.path));
          const qualifiedPaths = new Set(relevantQualifications.filter((qualification) => qualification.confidence === "high").map((qualification) => qualification.path));`,
          );
          replaceRegex(
            'src/explanation.ts',
            /^  const targetedForRelated = .*$/m,
            `  const targetedForRelated = checks.filter((check) => (check.targetQualifications ?? []).some((qualification) => qualification.confidence === "high" && item.relatedTests.includes(qualification.path)));`,
          );
          replaceRegex(
            'src/explanation.ts',
            /^  const failedObservation = observations\.find\(.*$/m,
            `  const qualificationForObservation = (check: CheckResult, observation: NonNullable<CheckResult["targetObservations"]>[number]) => check.targetQualifications?.find((qualification) => qualification.path === observation.path && qualification.runnerPath === observation.runnerPath);
          const exactObservations = observations.filter(({ check, observation }) => qualificationForObservation(check, observation)?.confidence === "high");
          const failedObservation = exactObservations.find(({ observation }) => observation.outcome === "failed");`,
          );
          replaceRegex('src/explanation.ts', /^  const unavailableObservation = observations\.find\(.*$/m, `  const unavailableObservation = exactObservations.find(({ observation }) => observation.outcome === "not-observed");`);
          replaceRegex('src/explanation.ts', /^  const zeroObservation = observations\.find\(.*$/m, `  const zeroObservation = exactObservations.find(({ observation }) => observation.outcome === "zero-tests");`);
          replaceRegex('src/explanation.ts', /^  const skippedObservation = observations\.find\(.*$/m, `  const skippedObservation = exactObservations.find(({ observation }) => observation.outcome === "skipped");`);
          replaceRegex(
            'src/explanation.ts',
            /check\.targetObservations\?\.some\(\(observation\) => observation\.outcome === "failed"\) !== true/,
            `check.targetObservations?.some((observation) => observation.outcome === "failed" && qualificationForObservation(check, observation)?.confidence === "high") !== true`,
          );
          replaceRegex(
            'src/explanation.ts',
            /check\.targetObservations\?\.some\(\(observation\) => item\.relatedTests\.includes\(observation\.path\) && observation\.outcome === "not-observed"\) === true/,
            `check.targetObservations?.some((observation) => item.relatedTests.includes(observation.path) && observation.outcome === "not-observed" && qualificationForObservation(check, observation)?.confidence === "high") === true`,
          );
          replaceRegex(
            'src/explanation.ts',
            /A repository command passed, but no related test-like path was qualified as an exact target for a recognized runner\./,
            `A repository command passed, but no related test-like path had high-confidence qualification as an exact source target for a recognized runner.`,
          );
          replaceRegex(
            'src/explanation.ts',
            /Related test-like paths were found or declared, but none were qualified as exact targets for a recognized runner\./,
            `Related test-like paths were found or declared, but none had high-confidence qualification as exact source targets for a recognized runner.`,
          );
          replaceRegex(
            'src/explanation.ts',
            /Use a supported runner convention or explicit runner target so ProofDiff can bind runtime observation to the related test file\./,
            `Use a supported runner convention or explicit source target so ProofDiff can bind runtime observation to the related test file with high confidence.`,
          );

          const analyze = fs.readFileSync('tests/analyze.test.ts', 'utf8');
          const anchor = 'test("failing verification cannot be mistaken for success", async (context) => {';
          if (!analyze.includes(anchor)) throw new Error('tests/analyze.test.ts: regression anchor missing');
          const regression = `test("filename-only compiled mappings cannot promote stale runner output to verified", async (context) => {
            const root = await initializeRepository({
              "package.json": JSON.stringify({ name: "compiled-boundary", private: true, type: "module", scripts: { test: "node --test dist-test/tests/value.test.js" } }),
              "src/value.ts": "export const value = 1;\\n",
              "tests/value.test.ts": "import test from 'node:test'; import assert from 'node:assert/strict'; import { value } from '../src/value.ts'; test('value', () => assert.equal(value, 2));\\n",
              "dist-test/tests/value.test.js": "import test from 'node:test'; import assert from 'node:assert/strict'; test('stale compiled artifact', () => assert.equal(1, 1));\\n",
            });
            context.after(() => rm(root, { recursive: true, force: true }));
            await writeFiles(root, { "src/value.ts": "export const value = 2;\\n" });

            const report = await analyzeRepository({ repo: root, runChecks: true, timeoutMs: 20_000 });
            const assessment = report.assessments[0];
            const targeted = report.checks.find((check) => check.id.endsWith(":targeted"));
            assert.equal(targeted?.targetQualifications?.[0]?.basis, "compiled-source-map");
            assert.equal(targeted?.targetQualifications?.[0]?.confidence, "medium");
            assert.equal(targeted?.targetObservations?.[0]?.outcome, "passed");
            assert.equal(assessment?.status, "partially-verified");
            assert.deepEqual(assessment?.relatedTests, ["tests/value.test.ts"]);
            assert.deepEqual(assessment?.executedTests, []);
            assert.deepEqual(assessment?.testExecutions, []);
            assert.match(assessment?.evidence.find((item) => item.label.includes("medium-confidence target identity"))?.detail ?? "", /cannot strengthen this source path to verified/);
            assert.match(assessment?.limitations.join("\\n") ?? "", /no high-confidence runner-qualified source target/);
            assert.equal(assessment?.evidenceBoundary?.stage, "runner-qualification");
            assert.equal(assessment?.evidenceBoundary?.reason, "opaque-passing-check");
            assert.match(assessment?.evidenceBoundary?.detail ?? "", /high-confidence qualification/);
          });

          `;
          fs.writeFileSync('tests/analyze.test.ts', analyze.replace(anchor, regression + anchor));
          NODE
      - run: npm test
      - run: npm run clean && npm run build
      - name: Commit source, regression, and generated dist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/evidence.ts src/explanation.ts tests/analyze.test.ts dist
          git diff --cached --check
          git commit -m "Require high-confidence target identity for verified evidence"
          git push
