name: One-time rename hunk format

on:
  push:
    branches:
      - fix/rename-hunk-pathspec
    paths:
      - .github/workflows/one-time-rename-hunk-format.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rename-hunk-pathspec
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix source formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          git_path = Path('src/git.ts')
          text = git_path.read_text()
          needle = '\n    patch = await git(root, ["diff", ...safeDiffOptions, "--unified=0", "--find-renames", ...diffArgs, "--", ...pathspec], true);'
          replacement = '\n      patch = await git(root, ["diff", ...safeDiffOptions, "--unified=0", "--find-renames", ...diffArgs, "--", ...pathspec], true);'
          if text.count(needle) != 1:
              raise SystemExit(f'src/git.ts indentation target count was {text.count(needle)}')
          git_path.write_text(text.replace(needle, replacement, 1))

          test_path = Path('tests/git.test.ts')
          text = test_path.read_text()
          needle = '\nassert.deepEqual(file?.hunks, []);\n'
          replacement = '\n  assert.deepEqual(file?.hunks, []);\n'
          if text.count(needle) != 1:
              raise SystemExit(f'tests/git.test.ts indentation target count was {text.count(needle)}')
          test_path.write_text(text.replace(needle, replacement, 1))
          PY
      - run: npm test
      - run: |
          npm run clean
          npm run build
      - run: git diff --check
      - name: Commit formatting and regenerated dist
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/git.ts tests/git.test.ts dist
          git commit -m "Normalize rename hunk regression formatting"
          git push origin HEAD:fix/rename-hunk-pathspec
