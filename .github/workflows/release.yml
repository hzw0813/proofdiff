name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated version tag to package (for example, v0.1.0)
        type: string
        required: true
      publish_npm:
        description: Publish the verified tarball to npm (requires protected environment approval)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          git cat-file -e "${RELEASE_TAG}^{tag}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - run: npm test
      - run: npm run test:action
      - name: Pack once
        run: npm pack
      - name: Checksum
        shell: bash
        run: sha256sum proofdiff-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: proofdiff-${{ inputs.release_tag }}
          path: |
            proofdiff-*.tgz
            SHA256SUMS

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: proofdiff-${{ inputs.release_tag }}
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" proofdiff-*.tgz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" proofdiff-*.tgz SHA256SUMS --verify-tag --generate-notes --title "ProofDiff $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    if: inputs.publish_npm
    needs: [package, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: proofdiff-${{ inputs.release_tag }}
      - name: Publish exact verified artifact
        run: npm publish proofdiff-*.tgz --provenance --access public
