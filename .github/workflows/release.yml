name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the verified tarball to npm (requires protected environment approval)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run test:action
      - name: Pack once
        run: npm pack
      - name: Checksum
        shell: bash
        run: sha256sum proofdiff-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: proofdiff-${{ github.ref_name }}
          path: |
            proofdiff-*.tgz
            SHA256SUMS

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: proofdiff-${{ github.ref_name }}
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" proofdiff-*.tgz SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" proofdiff-*.tgz SHA256SUMS --verify-tag --generate-notes --title "ProofDiff $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    if: inputs.publish_npm
    needs: [package, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: proofdiff-${{ github.ref_name }}
      - name: Publish exact verified artifact
        run: npm publish proofdiff-*.tgz --provenance --access public
